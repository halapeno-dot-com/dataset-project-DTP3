{% extends 'layout.html' %}

{% block body %}

    <div class="searchbar">
    <h3>SEARCH</h3>
      <form action="/search" method="GET"></form>
        <input type="text" name="q" value="{{ query }}" id="searchbar" placeholder="Search..">
        <button type="submit">Search</button>
      </form>
      <div id="search-result-card">
        {% if search_result %}
            <h3>Astronaut Found</h3>
            <p><strong>ID:</strong> {{ search_result[0] }}</p>
            <p><strong>Name:</strong> {{ search_result[1] }}</p>
            <a href="{{ url_for('astronaut', id=search_result[0]) }}">View Full Profile</a>
        {% elif query %}
            <h3>No astronaut found</h3>
        {% endif %}
      </div>
  </div>

{% endblock %}
